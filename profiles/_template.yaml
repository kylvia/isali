---
# _template — 一个"写作风格 profile"长什么样的 schema 模板
#
# ⚠️ 这只是字段形状示例 —— 所有字段值都是"该字段该填什么"的占位说明，
#    不是任何具体作者 / 品牌 / 风格的内置实现。请 cp 后改成你自己的真实拆解。
#
# 用法：
#   1. cp 此文件到 ~/.isali/profiles/<你的风格名>.yaml
#   2. 用真实拆解替换每个字段的占位说明
#      (建议先用 isali fetch / browser-relay 抓 3 篇该风格代表作，让 AI 按 9 维度填)
#   3. isali profile switch <你的风格名>
#   4. isali profile current  +  让 AI 用此 profile 模仿写 200 字验证
#
# 相关命令：
#   isali profile list / current / show / edit / diff
#
# 一个 profile = 一种声音 / 一种身份 / 一种写作风格。default.yaml 是兜底身份，
# 不承载具体风格。所有可选字段为空 = 不约束该维度。

name: _template                    # 改成你的风格名（从此文件 cp 出去后第一件事就是改这）
author:
  display_name: ""                 # 这种风格的展示名（如品牌名、作者代号）

content:
  tone: ""                         # 一句话风格标签（如：冷静观察派 / 学术严谨派 / 故事讲述派）
  length_target: ""                # 目标字数范围，如 "1500-2500"
  language: zh-CN

  tags: []                         # 文末话题标签

  # ─── 写作风格 9 维度（核心） ──────────────
  # 用 YAML | 多行块写自然语言指令，不要写关键词列表。
  # 每个字段都是给 subagent 起草时的硬约束。
  style:
    core_view: |
      [核心观点提炼策略：从一堆素材里挑"那一句"的方法 + 通常出现在文章的什么位置]

    persuasion: |
      [说服策略：类比 / 数据 / 故事 / 引经据典 各占多少比例 + 主用哪类]

    emotion_trigger: |
      [情绪触发点：高频词 + 高频句式（什么样的转折/反问/感叹）]

    sentence: |
      [金句构造：句长偏好（短促 vs 长句）、排比/对仗/反问的使用尺度]

    emotion_curve: |
      [情感曲线：全文情绪走向，如 平→高→平 / 冷→热 / 一直冷静]

    argumentation: |
      [论证方式：演绎（总→分）/ 归纳（分→总）/ 对比 三选一 + 该用什么口吻]

    perspective: |
      [视角：第几人称、是否切换、何时拉远何时拉近、避免哪些称谓]

    language: |
      [语言风格：书面 vs 口语、文白夹杂尺度、emoji / 网络梗 是否允许]

    hook: |
      [钩子设计：标题 / 开头 / 段间 各自的钩子模式]

# ─── 微信公众号 ───────────────────────────
wechat:
  default_theme: ""                # default / grace / simple / modern

# ─── 封面 ─────────────────────────────────
cover:
  aspect_ratio: ""                 # e.g. "2.35:1" / "16:9" / "1:1"
  style_preset: ""                 # minimal-tech / editorial / poster
