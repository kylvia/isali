---
# isali profile — edit ~/.isali/profile.yaml to override
# All fields are optional; skills read what they need.

name: default
author:
  display_name: you
  email: ""

# ─── 内容创作偏好 ───────────────────────────
content:
  tone: 温和吐槽派           # 封神派 / 温和吐槽派 / 事实核查派 / 独立博客风
  length_target: 1500-2000
  language: zh-CN
  primary_color: "#8087EA"
  tags:
    - "#AI"
    - "#科技"

# ─── 微信公众号 ─────────────────────────────
wechat:
  default_theme: grace       # default / grace / simple / modern
  account_alias: main        # 如果 baoyu 配了多账号

# ─── 封面 ─────────────────────────────────
cover:
  aspect_ratio: "2.35:1"
  style_preset: minimal-tech # minimal-tech / editorial / poster
  brand_color: "#8087EA"

# ─── CTA 导流 ───────────────────────────────
cta:
  - text: 了解更多
    url: https://example.com

# ─── 运维域（未来扩展预留）────────────────
ops:
  default_server: ""

# ─── 前端域（未来扩展预留）────────────────
frontend:
  ui_lib: ""
